# AI SAST Audit — runs the auditor in CI and uploads findings to GitHub code scanning.
#
# Setup: add your key as a repo secret named ANTHROPIC_API_KEY
#        (Settings → Secrets and variables → Actions → New repository secret).
#
# Note: each run calls the Anthropic API and costs money. It's wired to manual
# dispatch by default; uncomment `pull_request` to scan every PR (weigh the cost).
name: AI SAST Audit

on:
  workflow_dispatch:
  # pull_request:

permissions:
  contents: read
  security-events: write # required to upload the SARIF results

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run AI SAST Auditor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sast_auditor.py . --sarif results.sarif --md sast-report.md

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Upload Markdown report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.md
